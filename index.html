    <main class="main-stage">
      <section class="app-view is-active" id="view-banner" data-view-panel="banner">

              <img
                class="feature-backdrop"
                src="./assets/generated/optimized/astral-banner-1280.webp"
                srcset="./assets/generated/optimized/astral-banner-768.webp 768w, ./assets/generated/optimized/astral-banner-1280.webp 1280w"
                sizes="65vw"
                width="1536"
                height="1024"

                decoding="async"
                alt=""

            <div class="feature-vignette" aria-hidden="true"></div>
            <div class="feature-grid" aria-hidden="true"></div>
            <img

              height="1536"

            <div class="banner-copy">

              <h1 id="banner-title" data-i18n="bannerTitle"></h1>
              <p class="banner-subtitle" data-i18n="bannerSubtitle"></p>
              <div class="banner-meta">
                <span data-i18n="eventEnds"></span>
                <span aria-hidden="true">✦</span>
                <span data-i18n="featuredOdds"></span>

            </div>

            <div class="edition-index" aria-hidden="true">

          <aside class="pull-console" aria-labelledby="pull-console-title">

              </div>
              <div class="rarity-seal" aria-hidden="true"><span>UR</span></div>
            </div>

            <div class="pity-block">
              <div class="pity-copy">
                <span data-i18n="urPity"></span>
                <strong><span id="pity-value">0</span><small id="pity-limit">/ 80</small></strong>
              </div>
              <div class="pity-track" role="progressbar" aria-valuemin="0" aria-valuemax="80" aria-valuenow="0" id="pity-progress">

            <dl class="odds-strip">

            <div class="pull-actions">

                <small><i class="mini-gem dark" aria-hidden="true"></i><span data-i18n="pullTenCost"></span></small>

      <div class="summary-carousel-shell">
